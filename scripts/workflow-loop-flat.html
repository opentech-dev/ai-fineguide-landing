<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fbfafd}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block}
.t{font-size:26px;font-weight:680;fill:#1d1b33;letter-spacing:-.4px}
.st{font-size:14px;fill:#6b7194}
.eb{font-size:10px;font-weight:700;fill:#7c3aed;letter-spacing:1.3px}
.ct{font-size:15px;font-weight:650;fill:#1d1b33}
.cb{font-size:11.5px;fill:#6b7194}
.lbl{font-size:10.5px;fill:#8d92ab}
.sp{font-size:13px;font-weight:700;fill:#fff;letter-spacing:1.6px}
.spd{font-size:11.5px;fill:#c9bff0}
.chh{font-size:10px;font-weight:700;fill:#8d92ab;letter-spacing:1.3px}
.cht{font-size:12px;fill:#4a5068;font-weight:550}
.fbl{font-size:10.5px;fill:#7c3aed;font-weight:600}
.lg{font-size:11px;fill:#6b7194}
</style></head><body>
<svg width="1600" height="872" viewBox="0 0 1600 872" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="av" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0 1 L7 4.5 L0 8 z" fill="#7c3aed"/></marker>
  <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0 1 L7 4.5 L0 8 z" fill="#a9aec4"/></marker>
  <marker id="ai" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0 1 L7 4.5 L0 8 z" fill="#30226F"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#30226F" flood-opacity=".08"/></filter>
</defs>

<text class="t" x="50" y="52">How one conversation moves through Fineguide</text>
<text class="st" x="50" y="78">Every module writes to the same customer record. That is the loop.</text>

<!-- channels -->
<text class="chh" x="50" y="152">CHANNELS IN</text>
<g>
  <rect x="50" y="166" width="160" height="34" rx="9" fill="#f4f5f8" stroke="#e3e5ec"/>
  <text class="cht" x="68" y="188">Website chat</text>
  <rect x="50" y="208" width="160" height="34" rx="9" fill="#f4f5f8" stroke="#e3e5ec"/>
  <text class="cht" x="68" y="230">WhatsApp</text>
  <rect x="50" y="250" width="160" height="34" rx="9" fill="#f4f5f8" stroke="#e3e5ec"/>
  <text class="cht" x="68" y="272">Telegram</text>
  <rect x="50" y="292" width="160" height="34" rx="9" fill="#f4f5f8" stroke="#e3e5ec"/>
  <text class="cht" x="68" y="314">Email</text>
  <rect x="50" y="334" width="160" height="34" rx="9" fill="#f4f5f8" stroke="#e3e5ec"/>
  <text class="cht" x="68" y="356">Phone</text>
</g>
<path d="M210 267 L262 267" stroke="#a9aec4" stroke-width="1.6" fill="none" marker-end="url(#am)"/>

<!-- top row -->
<g filter="url(#sh)">
  <rect x="270" y="150" width="210" height="170" rx="14" fill="#fff" stroke="#e6e4f0"/>
  <rect x="525" y="150" width="210" height="170" rx="14" fill="#fff" stroke="#e6e4f0"/>
  <rect x="780" y="150" width="210" height="170" rx="14" fill="#fff" stroke="#e6e4f0"/>
  <rect x="1035" y="150" width="210" height="170" rx="14" fill="#fff" stroke="#e6e4f0"/>
  <rect x="1290" y="150" width="210" height="170" rx="14" fill="#fff" stroke="#e6e4f0"/>
</g>

<text class="eb" x="292" y="182">01 ARRIVES</text>
<text class="ct" x="292" y="208">Assistants</text>
<text class="cb" x="292" y="236">Answers on web, WhatsApp</text>
<text class="cb" x="292" y="254">and Telegram. Captures the</text>
<text class="cb" x="292" y="272">lead while nobody is on.</text>

<text class="eb" x="547" y="182">02 HANDS OFF</text>
<text class="ct" x="547" y="208">Inbox</text>
<text class="cb" x="547" y="236">A person takes over with</text>
<text class="cb" x="547" y="254">the full history and a</text>
<text class="cb" x="547" y="272">drafted reply waiting.</text>

<text class="eb" x="802" y="182">03 CALLS</text>
<text class="ct" x="802" y="208">Voice &amp; Campaigns</text>
<text class="cb" x="802" y="236">Callbacks, and outbound</text>
<text class="cb" x="802" y="254">runs that dial through a</text>
<text class="cb" x="802" y="272">list on their own.</text>

<text class="eb" x="1057" y="182">04 SCORED</text>
<text class="ct" x="1057" y="208">Voice QA</text>
<text class="cb" x="1057" y="236">Every call transcribed,</text>
<text class="cb" x="1057" y="254">scored and checked for</text>
<text class="cb" x="1057" y="272">compliance. No listening.</text>

<text class="eb" x="1312" y="182">05 LEARNS</text>
<text class="ct" x="1312" y="208">QA &amp; Analytics</text>
<text class="cb" x="1312" y="236">Patterns across every</text>
<text class="cb" x="1312" y="254">conversation show what</text>
<text class="cb" x="1312" y="272">to fix next.</text>

<!-- flow arrows across the top row -->
<path d="M480 235 L519 235" stroke="#a9aec4" stroke-width="1.6" fill="none" marker-end="url(#am)"/>
<path d="M735 235 L774 235" stroke="#a9aec4" stroke-width="1.6" fill="none" marker-end="url(#am)"/>
<path d="M990 235 L1029 235" stroke="#a9aec4" stroke-width="1.6" fill="none" marker-end="url(#am)"/>
<path d="M1245 235 L1284 235" stroke="#a9aec4" stroke-width="1.6" fill="none" marker-end="url(#am)"/>

<!-- down into the record -->
<path d="M375 320 L375 414" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#av)"/>
<path d="M630 320 L630 414" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#av)"/>
<path d="M885 320 L885 414" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#av)"/>
<path d="M1140 320 L1140 414" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#av)"/>
<path d="M1395 320 L1395 414" stroke="#7c3aed" stroke-width="1.6" fill="none" marker-end="url(#av)"/>
<text class="lbl" x="385" y="372">creates it</text>
<text class="lbl" x="640" y="372">updates it</text>
<text class="lbl" x="895" y="372">logs the call</text>
<text class="lbl" x="1150" y="372">scores it</text>
<text class="lbl" x="1405" y="372">reads all of it</text>

<!-- the record -->
<rect x="270" y="420" width="1230" height="82" rx="14" fill="#30226F"/>
<text class="sp" x="885" y="456" text-anchor="middle">ONE CUSTOMER RECORD</text>
<text class="spd" x="885" y="479" text-anchor="middle">Lead #4218 · intent · stage · next action · the same object in every module</text>

<!-- attached to the record -->
<path d="M610 562 L610 508" stroke="#30226F" stroke-width="1.6" fill="none" marker-end="url(#ai)"/>
<path d="M1070 562 L1070 508" stroke="#30226F" stroke-width="1.6" fill="none" marker-end="url(#ai)"/>
<g filter="url(#sh)">
  <rect x="470" y="564" width="280" height="118" rx="14" fill="#fff" stroke="#e6e4f0"/>
  <rect x="930" y="564" width="280" height="118" rx="14" fill="#fff" stroke="#e6e4f0"/>
</g>
<text class="ct" x="494" y="600">Workspace</text>
<text class="cb" x="494" y="628">Quotes and documents live on</text>
<text class="cb" x="494" y="646">the customer, not in someone's</text>
<text class="cb" x="494" y="664">mailbox.</text>
<text class="ct" x="954" y="600">Automations</text>
<text class="cb" x="954" y="628">Reads the finished conversation</text>
<text class="cb" x="954" y="646">and updates the record. No one</text>
<text class="cb" x="954" y="664">touches it.</text>

<!-- feedback loop -->
<path d="M1500 235 L1545 235 L1545 766 L320 766 L320 328" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-dasharray="6 5" marker-end="url(#av)"/>
<rect x="700" y="752" width="336" height="28" rx="6" fill="#fbfafd"/>
<text class="fbl" x="868" y="771" text-anchor="middle">what it learns tunes the assistant</text>

<!-- legend -->
<rect x="50" y="812" width="13" height="13" rx="4" fill="#f4f5f8" stroke="#e3e5ec"/>
<text class="lg" x="72" y="823">where customers reach you</text>
<rect x="290" y="812" width="13" height="13" rx="4" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
<text class="lg" x="312" y="823">platform modules</text>
<rect x="470" y="812" width="13" height="13" rx="4" fill="#30226F"/>
<text class="lg" x="492" y="823">the record every module shares</text>
</svg>
</body></html>
