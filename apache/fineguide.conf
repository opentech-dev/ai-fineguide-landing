# fineguide.ai: the Astro static site, served by plain Apache with no PHP.
# Included from the stock httpd.conf of the httpd:2.4 image (see Dockerfile).

LoadModule rewrite_module modules/mod_rewrite.so

# With its scheme: Cloudflare ends TLS before this server, and without it every redirect it makes (a trailing
# slash, the old blog addresses) would send the visitor to http:// first.
ServerName https://fineguide.ai

# The blog's feed and Markdown copies (src/pages/blog), in UTF-8: one post is in Russian.
AddType text/markdown .md
AddCharset utf-8 .md .xml .txt
<Files "rss.xml">
    ForceType "application/rss+xml; charset=utf-8"
</Files>

# Tell the pricing page which country a visitor is in, so US visitors see
# dollars. Cloudflare sends CF-IPCountry (the RO/MD redirect below uses it too).
# Scoped to the pricing page: a Set-Cookie on images or CSS would stop
# Cloudflare caching them.
SetEnvIf CF-IPCountry "^([A-Za-z]{2})$" FG_COUNTRY=$1
<LocationMatch "^/pricing(/|/index\.html)?$">
    Header always set Set-Cookie "fg-country=%{FG_COUNTRY}e; Path=/; Max-Age=86400; SameSite=Lax; Secure" env=FG_COUNTRY
</LocationMatch>

<Directory "/usr/local/apache2/htdocs">
    Options FollowSymLinks
    AllowOverride None
    DirectoryIndex index.html

    RewriteEngine On
    RewriteBase /

    # The blog was WordPress until 2026-10-21 (retired: PHP2Shell); it is static now (src/pages/blog, posts from the
    # API — ai-fineguide-project docs/BLOG.md). Posts, topics and tags kept their addresses; what only WordPress had
    # is gone for good (410) or sent to where it lives now.
    RewriteRule ^_blog(/|$) - [G]
    RewriteRule ^blog/(wp-admin|wp-content|wp-includes|wp-json)(/|$) - [G]
    RewriteRule ^blog/(xmlrpc|wp-[a-z-]+)\.php$ - [G]
    RewriteRule ^blog/(.+/)?feed/?$ /blog/rss.xml [R=301,L]
    RewriteRule ^blog/(page/[0-9]+|author/[^/]+|category|category/uncategorized|tag/featured)/?$ /blog/ [R=301,L]
    RewriteRule ^blog/__trashed-19/?$ /blog/create-your-first-ai-assistant-in-fineguide/ [R=301,L]
    RewriteRule ^blog/руководство-по-интеграции-с-amocrm/?$ /blog/rukovodstvo-po-integratsii-s-amocrm/ [R=301,L]
    # The guide's first, shorter version (Dec 2025); the 2026-02-13 rewrite above replaced it.
    RewriteRule ^blog/amocrm-integration-guide/?$ /blog/rukovodstvo-po-integratsii-s-amocrm/ [R=301,L]
    # The Facebook app's Terms of Service address (Meta app settings) — the page has always lived here.
    RewriteRule ^terms-and-conditions/?$ /terms-of-service [R=301,L]
    # The Romanian menu links the one blog.
    RewriteRule ^ro/blog(/.*)?$ /blog$1 [R=301,L]

    # GeoIP redirect for Romania and Moldova — only if no language preference cookie
    RewriteCond %{REQUEST_URI} ^/$
    RewriteCond %{HTTP_COOKIE} !fg-lang=
    RewriteCond %{HTTP:CF-IPCountry} ^(MD|RO)$ [NC]
    RewriteRule ^(.*)$ /ro/ [R=302,L,CO=fg-lang:ro:.fineguide.ai:525600:/]

    # If exact file exists, serve it
    RewriteCond %{REQUEST_FILENAME} -f
    RewriteRule . - [L]

    # If directory with index.html exists, serve it (Astro clean URLs)
    RewriteCond %{REQUEST_FILENAME}/index.html -f
    RewriteRule ^(.*)/?$ $1/index.html [L]

    # Trailing-slash directory index
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}/index.html -f
    RewriteRule ^(.*)$ $1/index.html [L]
</Directory>

# The blog's images never change at an address (each is a new id): keep them a year.
<LocationMatch "^/blog/media/[0-9a-f]{24}\.(png|jpg|webp|gif)$">
    Header always set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
